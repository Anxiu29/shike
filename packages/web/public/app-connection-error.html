<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>食刻 · 重新打开</title><style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f5f8f0;color:#274b3d;font:16px/1.8 system-ui,sans-serif}main{max-width:420px;padding:30px}h1{font-size:25px}p{color:#71846e}button{border:0;border-radius:14px;background:#367b5d;color:white;padding:13px 24px;font:inherit}small{display:block;color:#8a9983;margin:20px 0}code{overflow-wrap:anywhere}</style></head><body><main><h1>暂时无法打开食刻</h1><p id="message">请退出 App 后重新打开。独立版的本地记录不需要电脑在线。</p><small id="address"></small><button id="retry">重新连接</button><p><small>请勿为重试而清除应用数据或卸载；本地记录需要先导出备份。</small></p></main><script>const target = null;if(target)document.getElementById('message').textContent='这是局域网联调包，请确认电脑服务运行且手机能访问电脑，再试一次。';document.getElementById('address').textContent=target??'';document.getElementById('retry').addEventListener('click',()=>location.replace(target??'/'));</script></body></html>
