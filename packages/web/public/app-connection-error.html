<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>食刻 · 连接测试服务</title><style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f5f8f0;color:#274b3d;font:16px/1.8 system-ui,sans-serif}main{max-width:420px;padding:30px}h1{font-size:25px}p{color:#71846e}button{border:0;border-radius:14px;background:#367b5d;color:white;padding:13px 24px;font:inherit}small{display:block;color:#8a9983;margin:20px 0}code{overflow-wrap:anywhere}</style></head><body><main><h1>暂时连接不到食刻</h1><p>这是安卓联调版。请确认电脑的食刻服务正在运行，手机与电脑连接同一 Wi-Fi，再试一次。</p><small id="address"></small><button id="retry">重新连接</button><p><small>电脑换网或 IP 改变后，需要重新生成测试包。记录仍保存在 App 内，请勿为重试而清除 App 数据。</small></p></main><script>const target = null;document.getElementById('address').textContent=target??'';document.getElementById('retry').addEventListener('click',()=>location.replace(target??'/'));</script></body></html>
